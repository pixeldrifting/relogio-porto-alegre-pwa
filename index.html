<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relógio Porto Alegre (PWA)</title>
  <link rel="manifest" href="/manifest.json" />

  <style>
    :root { --bg:#0b1220; --fg:#e6eef8; --accent:#3ddc84; }
    html,body{
      height:100%;margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    body{
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#061024,#091427);
      color:var(--fg);
    }
    .card{
      background:rgba(255,255,255,0.03);
      padding:36px;border-radius:16px;
      box-shadow:0 6px 30px rgba(2,6,23,0.6);
      text-align:center;min-width:320px;
    }
    .time{font-size:5rem;margin:0;}
    .tz{font-size:1rem;color:rgba(230,238,248,0.7);margin-top:8px;}
    .status{margin-top:10px;font-size:0.9rem;color:rgba(230,238,248,0.6);}
    .small{font-size:0.85rem;color:rgba(230,238,248,0.55);margin-top:12px;}

    .intervalo{margin-top:24px;text-align:left;}
    .row{display:flex;align-items:center;gap:12px;margin-top:10px;}
    .label{width:70px;font-size:0.9rem;}
    .value{
      flex:1;border-bottom:1px solid rgba(255,255,255,0.3);
      min-height:22px;
    }
    button{
      margin-top:16px;
      padding:10px 14px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      background:var(--accent);
      color:#04210f;
      font-weight:600;
    }
    .link{
      background:none;color:var(--accent);
      font-weight:500;margin-top:12px;
    }
  </style>
</head>

<body>
<div class="card" role="main">

  <div id="time" class="time">--:--:--</div>
  <div class="tz">America/Sao_Paulo (Porto Alegre)</div>
  <div id="status" class="status">Sincronizando...</div>
  <div class="small">Preciso ao carregar — ressincroniza automaticamente.</div>

  <button id="resync" class="link">Ressincronizar agora</button>

  <div class="intervalo">
    <div class="row">
      <div class="label">INÍCIO</div>
      <div id="inicio" class="value"></div>
    </div>
    <div class="row">
      <div class="label">TÉRMINO</div>
      <div id="termino" class="value"></div>
    </div>

    <button id="startInterval">Início</button>
  </div>

</div>

<script>
const API = "https://worldtimeapi.org/api/timezone/America/Sao_Paulo";
const STORAGE_KEY = "intervalo15min";

const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const resyncBtn = document.getElementById("resync");

const inicioEl = document.getElementById("inicio");
const terminoEl = document.getElementById("termino");
const startBtn = document.getElementById("startInterval");

let serverEpoch = null;
let startPerf = null;

let intervaloAtivo = false;
let fimIntervaloMs = null;

async function syncTime() {
  statusEl.textContent = "Sincronizando...";
  try {
    const r = await fetch(API, { cache: "no-store" });
    const j = await r.json();
    serverEpoch = Date.parse(j.datetime);
    startPerf = performance.now();
    statusEl.textContent =
      `Sincronizado em ${new Date(serverEpoch).toLocaleTimeString()} (worldtimeapi.org)`;
  } catch {
    serverEpoch = Date.now();
    startPerf = performance.now();
    statusEl.textContent = "Falha na sincronização — usando horário local";
  }
}

function getNow() {
  return new Date(serverEpoch + (performance.now() - startPerf));
}

function pad(n){ return n.toString().padStart(2,"0"); }
function fmt(d){
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function loop(){
  const now = getNow();
  timeEl.textContent = fmt(now);

  if(intervaloAtivo && now.getTime() >= fimIntervaloMs){
    inicioEl.textContent = "";
    terminoEl.textContent = "";
    intervaloAtivo = false;
    fimIntervaloMs = null;
    localStorage.removeItem(STORAGE_KEY);
  }

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", ()=>{
  const inicio = getNow();
  const fim = new Date(inicio.getTime() + 15 * 60 * 1000);

  inicioEl.textContent = fmt(inicio);
  terminoEl.textContent = fmt(fim);

  fimIntervaloMs = fim.getTime();
  intervaloAtivo = true;

  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    inicio: inicio.getTime(),
    fim: fimIntervaloMs
  }));
});

resyncBtn.addEventListener("click", syncTime);

(async ()=>{
  await syncTime();

  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    const data = JSON.parse(saved);
    const now = getNow().getTime();

    if(now < data.fim){
      inicioEl.textContent = fmt(new Date(data.inicio));
      terminoEl.textContent = fmt(new Date(data.fim));
      fimIntervaloMs = data.fim;
      intervaloAtivo = true;
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  loop();

  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("/sw.js"); }
    catch(e){ console.warn("SW erro", e); }
  }
})();
</script>
</body>
</html>
